<template>
    <div class="pcs-wrap">
        <h3 class="pcs-title" style={primaryTextStyle}>Payment Channel Configuration</h3>
        <p class="pcs-sub">Configure your payment infrastructure. Select a channel to set up.</p>

        <!-- Channel tabs -->
        <div class="channel-tabs">
            <button class={sftpTabClass} data-channel="sftp" onclick={selectChannel} style={sftpTabStyle}>
                <span>📬</span> SFTP / Lockbox
            </button>
            <button class={achTabClass} data-channel="ach" onclick={selectChannel} style={achTabStyle}>
                <span>🔄</span> ACH / Nacha
            </button>
            <button class={wireTabClass} data-channel="wire" onclick={selectChannel} style={wireTabStyle}>
                <span>🏦</span> Wire Transfer
            </button>
        </div>

        <!-- ── SFTP / LOCKBOX ── -->
        <template if:true={showSftp}>
            <div class="channel-panel">
                <div class="channel-badge" style={badgeStyle}>SFTP + Lockbox</div>
                <h4 class="channel-title">Lockbox &amp; SFTP File Delivery</h4>
                <p class="channel-desc">Receive payments via physical check lockbox or electronic file delivery via SFTP. Files delivered in BAI2, ANSI X12 820, or custom delimited format.</p>

                <div class="config-section">
                    <h5>SFTP Connection Details</h5>
                    <div class="form-grid">
                        <div class="form-field">
                            <label>SFTP Host</label>
                            <input type="text" placeholder="sftp.yourbank.com" data-field="sftpHost" onchange={handleSftpInput}/>
                        </div>
                        <div class="form-field">
                            <label>Port</label>
                            <input type="number" placeholder="22" value="22" data-field="sftpPort" onchange={handleSftpInput}/>
                        </div>
                        <div class="form-field">
                            <label>Username</label>
                            <input type="text" placeholder="acme_corp_sftp" data-field="sftpUser" onchange={handleSftpInput}/>
                        </div>
                        <div class="form-field">
                            <label>Authentication</label>
                            <select data-field="sftpAuth" onchange={handleSftpInput}>
                                <option value="ssh_key">SSH Key (recommended)</option>
                                <option value="password">Password</option>
                            </select>
                        </div>
                        <div class="form-field form-field--full">
                            <label>Remote Directory Path</label>
                            <input type="text" placeholder="/incoming/payments/" data-field="sftpPath" onchange={handleSftpInput}/>
                        </div>
                    </div>
                </div>

                <div class="config-section">
                    <h5>File Format &amp; Schedule</h5>
                    <div class="form-grid">
                        <div class="form-field">
                            <label>File Format</label>
                            <select data-field="fileFormat" onchange={handleSftpInput}>
                                <option value="bai2">BAI2</option>
                                <option value="x12_820">ANSI X12 820</option>
                                <option value="csv">Delimited (CSV/TXT)</option>
                                <option value="ach">ACH/Nacha Flat File</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Delivery Frequency</label>
                            <select data-field="sftpFrequency" onchange={handleSftpInput}>
                                <option value="realtime">Real-time (as received)</option>
                                <option value="same_day">Same Day</option>
                                <option value="next_day">Next Business Day</option>
                                <option value="custom">Custom Schedule</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="config-section">
                    <h5>Lockbox Settings</h5>
                    <div class="form-grid">
                        <div class="form-field">
                            <label>Lockbox Number</label>
                            <input type="text" placeholder="LB-004821" data-field="lockboxNumber" onchange={handleSftpInput}/>
                        </div>
                        <div class="form-field">
                            <label>Remittance Processing</label>
                            <select data-field="remittance" onchange={handleSftpInput}>
                                <option value="standard">Standard (check + coupon)</option>
                                <option value="wholesale">Wholesale (invoice matching)</option>
                                <option value="image">Image Only</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Notify on Receipt</label>
                            <input type="email" placeholder="ar@yourcompany.com" data-field="sftpNotifyEmail" onchange={handleSftpInput}/>
                        </div>
                        <div class="form-field">
                            <label>PGP Encryption</label>
                            <select data-field="pgp" onchange={handleSftpInput}>
                                <option value="yes">Yes — encrypt all files</option>
                                <option value="no">No</option>
                            </select>
                        </div>
                    </div>
                </div>

                <template if:true={sftpSaved}>
                    <div class="save-confirm" style={confirmStyle}>✅ SFTP / Lockbox configuration saved. Provisioning ticket: <strong>{sftpTicket}</strong></div>
                </template>
                <div class="channel-actions">
                    <button class="btn-test" onclick={testSftp}>🔌 Test Connection</button>
                    <button class="btn-primary" style={primaryBtnStyle} onclick={saveSftp}>Save Configuration</button>
                </div>
            </div>
        </template>

        <!-- ── ACH / NACHA ── -->
        <template if:true={showAch}>
            <div class="channel-panel">
                <div class="channel-badge" style={badgeStyle}>ACH / Nacha</div>
                <h4 class="channel-title">ACH Payment Configuration</h4>
                <p class="channel-desc">Configure Automated Clearing House (ACH) origination and receipt per Nacha Operating Rules. Supports PPD, CCD, CTX, WEB, and TEL entries.</p>

                <div class="config-section">
                    <h5>Company Information (Nacha Header)</h5>
                    <div class="form-grid">
                        <div class="form-field form-field--full">
                            <label>Company Name (max 16 chars)</label>
                            <input type="text" placeholder="ACME CORP" maxlength="16" data-field="achCompanyName" onchange={handleAchInput}/>
                        </div>
                        <div class="form-field">
                            <label>Company ID (10-digit)</label>
                            <input type="text" placeholder="1234567890" maxlength="10" data-field="achCompanyId" onchange={handleAchInput}/>
                        </div>
                        <div class="form-field">
                            <label>Standard Entry Class</label>
                            <select data-field="secCode" onchange={handleAchInput}>
                                <option value="CCD">CCD — Corporate Credit/Debit</option>
                                <option value="CTX">CTX — Corporate Trade Exchange</option>
                                <option value="PPD">PPD — Prearranged Payment &amp; Deposit</option>
                                <option value="WEB">WEB — Internet-Initiated</option>
                                <option value="TEL">TEL — Telephone-Initiated</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Effective Entry Class</label>
                            <select data-field="achEffectiveDate" onchange={handleAchInput}>
                                <option value="same_day">Same Day ACH</option>
                                <option value="next_day">Next Business Day</option>
                                <option value="2_day">2-Day Standard</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="config-section">
                    <h5>Origination Limits</h5>
                    <div class="form-grid">
                        <div class="form-field">
                            <label>Daily Debit Limit</label>
                            <div class="input-prefix-wrap"><span class="input-prefix">$</span>
                            <input type="number" placeholder="500000" data-field="debitLimit" onchange={handleAchInput}/></div>
                        </div>
                        <div class="form-field">
                            <label>Daily Credit Limit</label>
                            <div class="input-prefix-wrap"><span class="input-prefix">$</span>
                            <input type="number" placeholder="500000" data-field="creditLimit" onchange={handleAchInput}/></div>
                        </div>
                        <div class="form-field">
                            <label>Single Transaction Limit</label>
                            <div class="input-prefix-wrap"><span class="input-prefix">$</span>
                            <input type="number" placeholder="100000" data-field="txnLimit" onchange={handleAchInput}/></div>
                        </div>
                        <div class="form-field">
                            <label>Return Rate Threshold</label>
                            <div class="input-prefix-wrap"><span class="input-prefix">%</span>
                            <input type="number" placeholder="0.5" step="0.1" data-field="returnRate" onchange={handleAchInput}/></div>
                        </div>
                    </div>
                </div>

                <div class="config-section">
                    <h5>File Transmission</h5>
                    <div class="form-grid">
                        <div class="form-field">
                            <label>Transmission Method</label>
                            <select data-field="achTransmission" onchange={handleAchInput}>
                                <option value="sftp">SFTP File Upload</option>
                                <option value="api">API (Nacha-compliant JSON)</option>
                                <option value="web_portal">Bank Web Portal</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label>Prenote Required</label>
                            <select data-field="prenote" onchange={handleAchInput}>
                                <option value="yes">Yes (recommended)</option>
                                <option value="no">No</option>
                            </select>
                        </div>
                    </div>
                </div>

                <template if:true={achSaved}>
                    <div class="save-confirm" style={confirmStyle}>✅ ACH configuration saved. ODFI approval pending. Ticket: <strong>{achTicket}</strong></div>
                </template>
                <div class="channel-actions">
                    <button class="btn-primary" style={primaryBtnStyle} onclick={saveAch}>Save ACH Configuration</button>
                </div>
            </div>
        </template>

        <!-- ── WIRE TRANSFER ── -->
        <template if:true={showWire}>
            <div class="channel-panel">
                <div class="channel-badge" style={badgeStyle}>Wire Transfer</div>
                <h4 class="channel-title">Domestic &amp; International Wire Configuration</h4>
                <p class="channel-desc">Configure wire transfer permissions, limits, and authorized users. Domestic wires settle via Fedwire or CHIPS. International wires use SWIFT.</p>

                <div class="config-section">
                    <h5>Wire Permissions</h5>
                    <div class="wire-perm-grid">
                        <template for:each={permissionRows} for:item="perm">
                            <div key={perm.id} class="wire-perm-row">
                                <div>
                                    <p class="perm-name">{perm.name}</p>
                                    <p class="perm-desc">{perm.desc}</p>
                                </div>
                                <div class="toggle-wrap">
                                    <input type="checkbox" id={perm.id} checked={perm.enabled} data-id={perm.id} onchange={togglePerm} class="toggle-input"/>
                                    <label for={perm.id} class="toggle-label" style={perm.toggleStyle}></label>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="config-section">
                    <h5>Dual Control &amp; Limits</h5>
                    <div class="form-grid">
                        <div class="form-field">
                            <label>Single Wire Limit</label>
                            <div class="input-prefix-wrap"><span class="input-prefix">$</span>
                            <input type="number" placeholder="1000000" data-field="wireLimit" onchange={handleWireInput}/></div>
                        </div>
                        <div class="form-field">
                            <label>Daily Wire Limit</label>
                            <div class="input-prefix-wrap"><span class="input-prefix">$</span>
                            <input type="number" placeholder="5000000" data-field="wireDailyLimit" onchange={handleWireInput}/></div>
                        </div>
                        <div class="form-field">
                            <label>Dual Control Threshold</label>
                            <div class="input-prefix-wrap"><span class="input-prefix">$</span>
                            <input type="number" placeholder="50000" data-field="dualControlThreshold" onchange={handleWireInput}/></div>
                        </div>
                        <div class="form-field">
                            <label>Approval Required</label>
                            <select data-field="approvalType" onchange={handleWireInput}>
                                <option value="single">Single approver</option>
                                <option value="dual">Dual approval</option>
                                <option value="threshold">Threshold-based</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="config-section">
                    <h5>SWIFT / International</h5>
                    <div class="form-grid">
                        <div class="form-field">
                            <label>SWIFT BIC</label>
                            <input type="text" placeholder="TRUIST2C" data-field="swiftBic" onchange={handleWireInput}/>
                        </div>
                        <div class="form-field">
                            <label>Correspondent Bank</label>
                            <input type="text" placeholder="JPMorgan Chase" data-field="correspondentBank" onchange={handleWireInput}/>
                        </div>
                    </div>
                </div>

                <template if:true={wireSaved}>
                    <div class="save-confirm" style={confirmStyle}>✅ Wire configuration saved. Ticket: <strong>{wireTicket}</strong></div>
                </template>
                <div class="channel-actions">
                    <button class="btn-primary" style={primaryBtnStyle} onclick={saveWire}>Save Wire Configuration</button>
                </div>
            </div>
        </template>

    </div>
</template>
