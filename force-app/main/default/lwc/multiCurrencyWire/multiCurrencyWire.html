<template>
    <div class="bh fx" style={brandStyle}>
        <div class="head">
            <h2 class="view-title">Send an international wire</h2>
            <p class="lede">From Business Checking ****4821. See the rate, fee and arrival time before you send.</p>
        </div>

        <div class="layout">
            <section class="card composer" aria-live="polite">
                <div class="leg">
                    <div class="field">
                        <label for="send">You send</label>
                        <div class="affix big"><span>$</span><input id="send" type="number" min="0" value={sendAmount} onchange={handleSendAmount}/></div>
                    </div>
                    <div class="field">
                        <label for="from">From account</label>
                        <select id="from" class="select tall" data-field="fromAccount" onchange={handleWireInput}>
                            <option value="checking_4821">Checking ****4821</option>
                            <option value="checking_9034">Checking ****9034</option>
                            <option value="money_market">Money market ****2201</option>
                        </select>
                    </div>
                </div>

                <div class="quote">
                    <span>Rate <strong class="num">1 USD = {selectedRate} {selectedCurrency}</strong></span>
                    <span class="quote-time">Updated {lastUpdated}</span>
                </div>

                <div class="leg">
                    <div class="field">
                        <span class="label">Recipient gets</span>
                        <div class="out num">{convertedAmount}</div>
                    </div>
                    <div class="field">
                        <label for="ccy">Currency</label>
                        <select id="ccy" class="select tall" onchange={handleCurrencySelect}>
                            <template for:each={currencyOptions} for:item="opt">
                                <option key={opt.code} value={opt.code} selected={opt.isSelected}>{opt.label}</option>
                            </template>
                        </select>
                    </div>
                </div>

                <dl class="dl summary">
                    <dt>Wire fee</dt><dd>{feeText}</dd>
                    <dt>Arrives</dt><dd>{settlementTime}</dd>
                    <dt class="total">Total debit</dt><dd class="total">{totalDebitUsd}</dd>
                </dl>

                <div class="config bene">
                    <h3>Beneficiary</h3>
                    <p class="help">Match the name and address on the beneficiary's bank account to avoid repairs.</p>
                    <div class="grid">
                        <div class="field full">
                            <label for="beneName">Beneficiary name</label>
                            <input id="beneName" class="input" type="text" data-field="beneName" onchange={handleWireInput}/>
                        </div>
                        <div class="field full">
                            <label for="beneAddress">Beneficiary address</label>
                            <input id="beneAddress" class="input" type="text" data-field="beneAddress" onchange={handleWireInput}/>
                        </div>
                        <div class="field">
                            <label for="beneIban">IBAN or account number</label>
                            <input id="beneIban" class="input" type="text" data-field="beneIban" onchange={handleWireInput}/>
                        </div>
                        <div class="field">
                            <label for="beneBic">SWIFT BIC</label>
                            <input id="beneBic" class="input" type="text" data-field="beneBic" onchange={handleWireInput}/>
                        </div>
                        <div class="field">
                            <label for="beneBank">Beneficiary bank</label>
                            <input id="beneBank" class="input" type="text" data-field="beneBank" onchange={handleWireInput}/>
                        </div>
                        <div class="field">
                            <label for="reason">Purpose</label>
                            <select id="reason" class="select" data-field="wireReason" onchange={handleWireInput}>
                                <option value="goods">Payment for goods</option>
                                <option value="services">Payment for services</option>
                                <option value="investment">Investment or capital</option>
                                <option value="intercompany">Intercompany transfer</option>
                                <option value="loan_repayment">Loan repayment</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="field full">
                            <label for="wireRef">Reference for the beneficiary</label>
                            <input id="wireRef" class="input" type="text" data-field="wireRef" onchange={handleWireInput}/>
                            <p class="help">For example an invoice number.</p>
                        </div>
                    </div>
                </div>

                <template lwc:if={templateSaved}>
                    <div class="notice result" role="status">Saved as a template. You'll find it under saved recipients.</div>
                </template>
                <template lwc:if={wireSubmitted}>
                    <div class="notice notice--success result" role="status">
                        <strong>Wire submitted.</strong> Reference <strong class="num">{wireConfirmRef}</strong>. Sending {sendAmountText} as {convertedAmount} to {beneficiaryName}. Arrives: {settlementTime}.
                    </div>
                </template>

                <div class="actions">
                    <button class="btn btn-ghost" onclick={saveDraft}>Save as template</button>
                    <span class="spacer"></span>
                    <button class="btn btn-primary" onclick={submitWire}>Send wire</button>
                </div>
            </section>

            <aside class="card rates">
                <div class="rates-head">
                    <h3 class="section-heading">Rates vs USD</h3>
                    <button class="btn btn-ghost refresh" onclick={refreshRates}>Refresh</button>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th scope="col">Currency</th><th scope="col">Rate</th><th scope="col">Today</th></tr></thead>
                        <tbody>
                            <template for:each={fxRates} for:item="r">
                                <tr key={r.code} class={r.rowClass} aria-selected={r.ariaSelected} data-code={r.code} onclick={selectCurrency}>
                                    <td><span class="code">{r.code}</span><span class="name">{r.name}</span></td>
                                    <td class="num">{r.rateText}</td>
                                    <td class={r.changeClass}><span aria-hidden="true">{r.change}</span><span class="sr-only">{r.changeLabel}</span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <p class="help foot">Indicative rates as of {lastUpdated}. Select a row or use the currency list.</p>
            </aside>
        </div>
    </div>
</template>
