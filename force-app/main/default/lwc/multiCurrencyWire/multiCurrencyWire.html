<template>
    <div class="fx-wrap">
        <div class="fx-header" style={headerStyle}>
            <div class="fx-header-left">
                <h2>🌍 Multi-Currency Wire</h2>
                <p>Send payments in 40+ currencies · Live FX rates · SWIFT / Fedwire</p>
            </div>
            <div class="fx-rate-ticker">
                <span class="ticker-label">Last updated:</span>
                <span class="ticker-time">{lastUpdated}</span>
                <button class="refresh-btn" onclick={refreshRates} title="Refresh rates">🔄</button>
            </div>
        </div>

        <!-- FX Rate Board -->
        <div class="rate-board">
            <h4 class="rate-board-title">Live FX Rates vs USD</h4>
            <div class="rate-grid">
                <template for:each={fxRates} for:item="rate">
                    <div key={rate.code} class={rate.cssClass} onclick={selectCurrency} data-code={rate.code}
                         style={rate.selectedStyle}>
                        <div class="rate-flag">{rate.flag}</div>
                        <div class="rate-info">
                            <div class="rate-code">{rate.code}</div>
                            <div class="rate-name">{rate.name}</div>
                        </div>
                        <div class="rate-right">
                            <div class="rate-value">{rate.rate}</div>
                            <div class="rate-change" style={rate.changeStyle}>{rate.change}</div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Wire Composer -->
        <div class="wire-composer">
            <h4 class="composer-title" style={primaryTextStyle}>Send Wire</h4>

            <div class="composer-grid">
                <!-- Sender side -->
                <div class="composer-side">
                    <h5>You Send (USD)</h5>
                    <div class="amount-row">
                        <span class="currency-flag">🇺🇸</span>
                        <span class="currency-code">USD</span>
                        <div class="input-prefix-wrap">
                            <span class="input-prefix">$</span>
                            <input type="number" value={sendAmount} onchange={handleSendAmount} placeholder="10000"/>
                        </div>
                    </div>
                    <div class="from-account">
                        <label>From Account</label>
                        <select data-field="fromAccount" onchange={handleWireInput}>
                            <option value="checking_4821">Business Checking ****4821</option>
                            <option value="checking_9034">Business Checking ****9034</option>
                            <option value="money_market">Money Market ****2201</option>
                        </select>
                    </div>
                </div>

                <!-- Arrow -->
                <div class="composer-arrow" style={primaryTextStyle}>
                    <div class="arrow-icon">→</div>
                    <div class="fee-display">
                        <div class="fee-row"><span>FX Rate:</span><span style={primaryTextStyle}><strong>1 USD = {selectedRate} {selectedCurrency}</strong></span></div>
                        <div class="fee-row"><span>Wire Fee:</span><span>$25.00</span></div>
                        <div class="fee-row"><span>Total:</span><strong>${totalDebitUsd}</strong></div>
                    </div>
                </div>

                <!-- Recipient side -->
                <div class="composer-side">
                    <h5>Recipient Gets ({selectedCurrency})</h5>
                    <div class="amount-row">
                        <span class="currency-flag">{selectedFlag}</span>
                        <span class="currency-code">{selectedCurrency}</span>
                        <div class="converted-amount" style={primaryTextStyle}>{convertedAmount}</div>
                    </div>
                    <div class="from-account">
                        <label>Currency</label>
                        <select onchange={handleCurrencySelect}>
                            <template for:each={currencyOptions} for:item="opt">
                                <option key={opt.code} value={opt.code} selected={opt.isSelected}>{opt.flag} {opt.code} — {opt.name}</option>
                            </template>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Beneficiary Details -->
            <div class="beneficiary-section">
                <h5>Beneficiary Information</h5>
                <div class="form-grid">
                    <div class="form-field form-field--full">
                        <label>Beneficiary Name</label>
                        <input type="text" placeholder="Global Supplies Ltd." data-field="beneName" onchange={handleWireInput}/>
                    </div>
                    <div class="form-field form-field--full">
                        <label>Beneficiary Address</label>
                        <input type="text" placeholder="22 Finance Street, London, UK EC2V 8RF" data-field="beneAddress" onchange={handleWireInput}/>
                    </div>
                    <div class="form-field">
                        <label>IBAN / Account Number</label>
                        <input type="text" placeholder="GB29NWBK60161331926819" data-field="beneIban" onchange={handleWireInput}/>
                    </div>
                    <div class="form-field">
                        <label>SWIFT / BIC Code</label>
                        <input type="text" placeholder="NWBKGB2L" data-field="beneBic" onchange={handleWireInput}/>
                    </div>
                    <div class="form-field">
                        <label>Beneficiary Bank</label>
                        <input type="text" placeholder="NatWest Bank plc" data-field="beneBank" onchange={handleWireInput}/>
                    </div>
                    <div class="form-field">
                        <label>Purpose of Payment</label>
                        <select data-field="wireReason" onchange={handleWireInput}>
                            <option value="goods">Payment for Goods</option>
                            <option value="services">Payment for Services</option>
                            <option value="investment">Investment / Capital</option>
                            <option value="intercompany">Intercompany Transfer</option>
                            <option value="loan_repayment">Loan Repayment</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-field form-field--full">
                        <label>Remittance Information / Reference</label>
                        <input type="text" placeholder="Invoice #INV-2026-0441" data-field="wireRef" onchange={handleWireInput}/>
                    </div>
                </div>
            </div>

            <template if:true={wireSubmitted}>
                <div class="wire-confirm" style={confirmBannerStyle}>
                    <div class="confirm-check">✅</div>
                    <div>
                        <p><strong>Wire Submitted</strong> — Reference: {wireConfirmRef}</p>
                        <p>Sending <strong>${sendAmount} USD</strong> → <strong>{convertedAmount} {selectedCurrency}</strong> to {wireData.beneName}</p>
                        <p class="confirm-note">Estimated settlement: {settlementTime}</p>
                    </div>
                </div>
            </template>

            <div class="wire-actions">
                <button class="btn-secondary" onclick={saveDraft}>Save as Template</button>
                <button class="btn-primary" style={primaryBtnStyle} onclick={submitWire}>Send Wire →</button>
            </div>
        </div>

    </div>
</template>
