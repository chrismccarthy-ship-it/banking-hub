<template>
    <div class="hub" style={brandVars}>

        <!-- Brand header -->
        <header class="hub-header">
            <div class="logo">
                <template lwc:if={hasLogoUrl}>
                    <img src={logoUrl} alt={brand.logoMark} class="logo-img" style={logoImgStyle} />
                </template>
                <template lwc:else>
                    <span class="logo-mark" aria-hidden="true">{brand.logoText}</span>
                    <span class="logo-name">{brand.logoMark}</span>
                </template>
            </div>
            <nav class="topnav" aria-label="Primary">
                <button class="topnav-item" aria-current={retailNavCurrent} onclick={setRetailMode}>Personal</button>
                <button class="topnav-item" aria-current={commercialNavCurrent} onclick={setCommercialMode}>Business</button>
            </nav>
            <template lwc:if={hasInitials}>
                <span class="avatar" title={firstName}>{initials}</span>
            </template>
        </header>

        <main class="hub-main">
            <div class="greet">
                <h1 class="greet-title">{greeting}</h1>
                <div class="seg" role="group" aria-label="Banking type">
                    <button class="seg-btn" aria-pressed={retailPressed} onclick={setRetailMode}>Personal</button>
                    <button class="seg-btn" aria-pressed={commercialPressed} onclick={setCommercialMode}>Commercial</button>
                </div>
            </div>

            <!-- ═══ PERSONAL ═══ -->
            <template lwc:if={isRetailMode}>
                <div class="top">
                    <section aria-labelledby="retail-tasks-title">
                        <h2 class="section-heading" id="retail-tasks-title">What would you like to do?</h2>
                        <div class="tasks">
                            <template for:each={retailTasks} for:item="task">
                                <button key={task.id} class={task.cssClass} data-id={task.id} aria-current={task.ariaCurrent} onclick={handleRetailTask}>
                                    <span class="task-text">
                                        <span class="task-label">{task.label}</span>
                                        <span class="task-desc">{task.description}</span>
                                    </span>
                                    <span class="chevron" aria-hidden="true"></span>
                                </button>
                            </template>
                        </div>
                    </section>

                    <aside class="card score" aria-label={scoreAriaLabel}>
                        <p class="eyebrow">FICO Score 8 · Equifax</p>
                        <div class="score-row">
                            <span class="score-num">{creditScore}</span>
                            <span class={tierClass}>{tierLabel}</span>
                        </div>
                        <div class="scale" aria-hidden="true">
                            <template for:each={scaleSegments} for:item="seg">
                                <i key={seg.key} class={seg.cssClass} style={seg.style}></i>
                            </template>
                            <span class="marker" style={markerStyle}></span>
                        </div>
                        <div class="scale-ends" aria-hidden="true"><span>300</span><span>850</span></div>
                        <p class="score-meta">Checking your score here never lowers it. <span class={creditLiveClass}>{creditLiveLabel}</span></p>
                    </aside>
                </div>

                <section class="content" aria-live="polite">
                    <template lwc:if={showCreditCard}>
                        <div class="content-head">
                            <h2 class="view-title">Credit cards for you</h2>
                            <p class="lede">Based on a soft check. Applying won't affect your score until you accept an offer.</p>
                        </div>
                        <div class="offers">
                            <article class="card offer offer--best">
                                <div class="offer-top">
                                    <div>
                                        <h3 class="offer-name">Premium Rewards</h3>
                                        <p class="offer-fee">$95 annual fee</p>
                                    </div>
                                    <span class="chip">Best match</span>
                                </div>
                                <div class="rates">
                                    <div><strong>3x</strong><span>Travel</span></div>
                                    <div><strong>2x</strong><span>Dining</span></div>
                                    <div><strong>1x</strong><span>Everything else</span></div>
                                </div>
                                <ul class="perks">
                                    <li>30,000 bonus points after $3,000 in 90 days</li>
                                    <li>No foreign transaction fees</li>
                                </ul>
                                <button class="btn btn-primary" onclick={navigatePremiumCard}>Apply now</button>
                            </article>
                            <article class="card offer">
                                <div class="offer-top">
                                    <div>
                                        <h3 class="offer-name">Cash Rewards</h3>
                                        <p class="offer-fee">$0 annual fee</p>
                                    </div>
                                </div>
                                <div class="rates">
                                    <div><strong>3%</strong><span>Gas</span></div>
                                    <div><strong>2%</strong><span>Groceries</span></div>
                                    <div><strong>1.5%</strong><span>Everything else</span></div>
                                </div>
                                <ul class="perks">
                                    <li>0% intro APR for 12 months on purchases</li>
                                    <li>Cash back never expires</li>
                                </ul>
                                <button class="btn btn-secondary" onclick={navigateCashCard}>View details</button>
                            </article>
                        </div>
                    </template>

                    <template lwc:if={showLoanMenu}>
                        <div class="content-head">
                            <h2 class="view-title">Which loan are you looking for?</h2>
                            <p class="lede">Check your rate in about 5 minutes. It won't affect your credit score.</p>
                        </div>
                        <div class="choices">
                            <template for:each={loans} for:item="loan">
                                <button key={loan.id} class="choice" data-id={loan.id} onclick={selectLoan}>
                                    <span class="task-text">
                                        <span class="task-label">{loan.label}</span>
                                        <span class="task-desc">{loan.description}</span>
                                    </span>
                                    <span class="choice-rate"><strong>{loan.rate}</strong><span>APR from</span></span>
                                    <span class="chevron" aria-hidden="true"></span>
                                </button>
                            </template>
                        </div>
                    </template>

                    <template lwc:if={showLoanApplication}>
                        <button class="btn btn-ghost back" onclick={backToLoans}>All loans</button>
                        <c-loan-application brand={brand} loan-type={selectedLoanType}></c-loan-application>
                    </template>

                    <template lwc:if={showRetailOnboarding}>
                        <c-retail-onboarding brand={brand} record-id={recordId}></c-retail-onboarding>
                    </template>

                    <template lwc:if={showPlaceholder}>
                        <div class="empty">
                            <h2 class="section-heading">{activeRetailLabel} isn't in this demo yet</h2>
                            <p class="lede">Credit cards, loans and account opening are fully built. Pick one of those to continue.</p>
                            <template lwc:if={hasBuiltRetailTask}>
                                <button class="btn btn-secondary" onclick={showBuiltTask}>{builtRetailLabel}</button>
                            </template>
                        </div>
                    </template>
                </section>
            </template>

            <!-- ═══ COMMERCIAL ═══ -->
            <template lwc:if={isCommercialMode}>
                <section aria-labelledby="commercial-tasks-title">
                    <h2 class="section-heading" id="commercial-tasks-title">Business banking</h2>
                    <div class="tasks tasks--wide">
                        <template for:each={commercialTasks} for:item="task">
                            <button key={task.id} class={task.cssClass} data-id={task.id} aria-current={task.ariaCurrent} onclick={handleCommercialTask}>
                                <span class="task-text">
                                    <span class="task-label">{task.label}</span>
                                    <span class="task-desc">{task.description}</span>
                                </span>
                                <span class="chevron" aria-hidden="true"></span>
                            </button>
                        </template>
                    </div>
                </section>

                <section class="content" aria-live="polite">
                    <template lwc:if={showCommercialOnboarding}>
                        <c-commercial-onboarding brand={brand}></c-commercial-onboarding>
                    </template>
                    <template lwc:if={showPaymentChannels}>
                        <c-payment-channel-setup brand={brand}></c-payment-channel-setup>
                    </template>
                    <template lwc:if={showMultiCurrency}>
                        <c-multi-currency-wire brand={brand}></c-multi-currency-wire>
                    </template>
                    <template lwc:if={showCommercialPlaceholder}>
                        <div class="empty">
                            <h2 class="section-heading">{activeCommercialLabel} isn't in this demo yet</h2>
                            <p class="lede">Business onboarding, payment channels and international wires are fully built.</p>
                            <button class="btn btn-secondary" onclick={showBusinessOnboarding}>Open a business account</button>
                        </div>
                    </template>
                </section>
            </template>
        </main>

        <!-- Demo settings: presenter only. Rendered when showDemoControls is on; Ctrl+Shift+B hides or shows it. -->
        <template lwc:if={showDemoButton}>
            <div class="demo" onkeydown={handleDemoPanelKeydown}>
                <template lwc:if={demoPanelOpen}>
                    <div class="demo-panel" role="dialog" aria-label="Demo settings">
                        <label class="demo-label" for="demo-brand">Brand</label>
                        <select id="demo-brand" class="demo-select" onchange={handleBrandChange}>
                            <template for:each={brandOptions} for:item="opt">
                                <option key={opt.id} value={opt.id} selected={opt.isSelected}>{opt.label}</option>
                            </template>
                        </select>
                        <p class="demo-hint">Ctrl+Shift+B hides this button.</p>
                        <button class="btn btn-ghost demo-done" onclick={closeDemoPanel}>Done</button>
                    </div>
                </template>
                <button class="demo-toggle" aria-label="Demo settings" title="Demo settings" aria-expanded={demoPanelOpen} onclick={toggleDemoPanel}></button>
            </div>
        </template>
    </div>
</template>
