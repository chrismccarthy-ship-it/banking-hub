<template>
    <div class="banking-hub" style={hubStyle}>

        <!-- Brand Header -->
        <div class="hub-header" style={headerStyle}>
            <div class="hub-logo">
                <!-- Static resource logo if configured, otherwise text fallback -->
                <template if:true={hasLogoUrl}>
                    <img src={logoUrl} alt={brand.logoMark} class="hub-logo-img" />
                </template>
                <template if:false={hasLogoUrl}>
                    <div class="logo-mark" style={logoMarkStyle}>{brand.logoText}</div>
                    <span class="logo-name" style={logoNameStyle}>{brand.logoMark}</span>
                </template>
            </div>
            <div class="hub-header-nav">
                <span>Personal</span>
                <span>Business</span>
                <span>Wealth</span>
            </div>
            <div class="hub-header-actions">
                <select class="brand-switcher" onchange={handleBrandChange} title="Switch bank brand">
                    <template for:each={brandOptions} for:item="opt">
                        <option key={opt.id} value={opt.id} selected={opt.isSelected}>{opt.label}</option>
                    </template>
                    <template if:true={customBrandLabel}>
                        <option value="custom">{customBrandLabel}</option>
                    </template>
                </select>
                <button class="hub-signin-btn" style={primaryBtnStyle}>Sign In</button>
            </div>
        </div>

        <!-- Mode Toggle -->
        <div class="mode-toggle-bar">
            <button class={retailModeClass} onclick={setRetailMode} style={retailTabStyle}>Personal Banking</button>
            <button class={commercialModeClass} onclick={setCommercialMode} style={commercialTabStyle}>Commercial Banking</button>
        </div>

        <!-- ═══ RETAIL MODE ═══ -->
        <template if:true={isRetailMode}>

            <!-- Credit Score Gauge Banner -->
            <div class="score-banner" style={lightBgStyle}>
                <div class="score-banner-left">
                    <h3 class="score-banner-title">Your Credit Profile</h3>
                    <p class="score-banner-sub">Based on your Equifax FICO® Score</p>
                </div>
                <c-banking-credit-gauge
                    credit-score={creditScore}
                    brand-color={brand.gaugeColor}
                    contact-id={recordId}
                ></c-banking-credit-gauge>
            </div>

            <!-- Nav - evenly spread, no scroll -->
            <div class="nav-section">
                <h2 class="nav-title">What can we help you with?</h2>
                <div class="nav-spread">
                    <template for:each={visibleRetailNavItems} for:item="item">
                        <button
                            key={item.id}
                            class={item.cssClass}
                            data-id={item.id}
                            onclick={handleNavClick}
                            style={item.activeInlineStyle}
                        >
                            <span class="nav-icon">{item.emoji}</span>
                            <span class="nav-label">{item.label}</span>
                        </button>
                    </template>
                </div>
            </div>

            <hr class="hub-divider" style={dividerStyle} />

            <!-- Retail Content Panels -->
            <div class="content-area">
                <template if:true={showRetailOnboarding}>
                    <c-retail-onboarding brand={brand} record-id={recordId}></c-retail-onboarding>
                </template>

                <template if:true={showLoanApplication}>
                    <c-loan-application brand={brand} loan-type={selectedLoanType}></c-loan-application>
                </template>

                <template if:true={showCreditCard}>
                    <div class="card-panel">
                        <h3 style={primaryTextStyle}>Credit Card Offerings</h3>
                        <p class="panel-sub">Select a card to learn more or apply.</p>
                        <div class="card-grid">
                            <!-- Premium Rewards Card -->
                            <div class="product-card" style={productCardStyle}>
                                <div class="product-card-header" style={primaryBgStyle}>
                                    <span class="product-badge">3x · 2x · 1x</span>
                                </div>
                                <div class="product-card-body">
                                    <h4>Premium Rewards</h4>
                                    <p>3x points on travel, 2x dining, 1x everything else. $95 annual fee. 30,000 bonus points.</p>
                                    <button class="product-btn" style={primaryBtnStyle} onclick={navigatePremiumCard}>Apply Now</button>
                                </div>
                            </div>
                            <!-- Cash Rewards Card -->
                            <div class="product-card" style={productCardStyle}>
                                <div class="product-card-header" style={accentBgStyle}>
                                    <span class="product-badge">Cash Back</span>
                                </div>
                                <div class="product-card-body">
                                    <h4>Cash Rewards</h4>
                                    <p>3% on gas, 2% on groceries, 1.5% on everything. $0 annual fee. 0% intro APR 12 months.</p>
                                    <button class="product-btn" style={primaryBtnStyle} onclick={navigateCashCard}>Apply Now</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <template if:true={showLoanMenu}>
                    <div class="loan-menu">
                        <h3 style={primaryTextStyle}>Select a Loan Type</h3>
                        <div class="loan-grid">
                            <button class="loan-tile" onclick={selectAutoLoan} style={loanTileStyle}>
                                <span class="loan-icon">🚗</span>
                                <span class="loan-tile-label">Auto Loan</span>
                                <span class="loan-tile-rate" style={primaryTextStyle}>from 5.49% APR</span>
                            </button>
                            <button class="loan-tile" onclick={selectHomeLoan} style={loanTileStyle}>
                                <span class="loan-icon">🏠</span>
                                <span class="loan-tile-label">Home Loan</span>
                                <span class="loan-tile-rate" style={primaryTextStyle}>from 6.75% APR</span>
                            </button>
                            <button class="loan-tile" onclick={selectPersonalLoan} style={loanTileStyle}>
                                <span class="loan-icon">💵</span>
                                <span class="loan-tile-label">Personal Loan</span>
                                <span class="loan-tile-rate" style={primaryTextStyle}>from 8.99% APR</span>
                            </button>
                        </div>
                    </div>
                </template>

                <template if:true={showPlaceholder}>
                    <div class="placeholder">Select a category above to get started.</div>
                </template>
            </div>
        </template>

        <!-- ═══ COMMERCIAL MODE ═══ -->
        <template if:true={isCommercialMode}>
            <div class="commercial-banner" style={primaryBgStyle}>
                <h2 class="commercial-banner-title">Commercial Banking</h2>
                <p class="commercial-banner-sub">Enterprise-grade solutions for your business</p>
            </div>

            <div class="nav-section">
                <div class="nav-spread">
                    <template for:each={commercialNavItems} for:item="item">
                        <button
                            key={item.id}
                            class={item.cssClass}
                            data-id={item.id}
                            onclick={handleCommercialNavClick}
                            style={item.activeInlineStyle}
                        >
                            <span class="nav-icon">{item.emoji}</span>
                            <span class="nav-label">{item.label}</span>
                        </button>
                    </template>
                </div>
            </div>

            <hr class="hub-divider" style={dividerStyle} />

            <div class="content-area">
                <template if:true={showCommercialOnboarding}>
                    <c-commercial-onboarding brand={brand}></c-commercial-onboarding>
                </template>
                <template if:true={showPaymentChannels}>
                    <c-payment-channel-setup brand={brand}></c-payment-channel-setup>
                </template>
                <template if:true={showMultiCurrency}>
                    <c-multi-currency-wire brand={brand}></c-multi-currency-wire>
                </template>
                <template if:true={showCommercialPlaceholder}>
                    <div class="placeholder">Select a service above to get started.</div>
                </template>
            </div>
        </template>

    </div>
</template>
